name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate agent syntax
        run: node --check agent/agent.mjs

      - name: Validate bot syntax
        run: node --check bot/bot.mjs

      - name: Validate scripts syntax
        run: |
          for f in scripts/*.mjs; do
            node --check "$f"
          done
