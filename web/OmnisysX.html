<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OmnisysX — Autonomous DeFi pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --surface:#0b0d10;
    --raised:#14171c;
    --raised-2:#191d23;
    --line:rgba(255,255,255,0.07);
    --line-strong:rgba(255,255,255,0.12);
    --text:#f4f5f7;
    --muted:#8a8f99;
    --muted-2:#5b626d;
    --blue:#2962ef;
    --blue-2:#5b9eff;
    --green:#10b981;
    --amber:#f59e0b;
    --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
  html{background:var(--bg)}
  body{overflow-x:hidden}
  ::selection{background:rgba(41,98,239,0.4)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .tnum{font-variant-numeric:tabular-nums}
  .fade-up{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
  .fade-up.pre{opacity:0;transform:translateY(24px)}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes floatY{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
  @keyframes mascotBurst{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
  @keyframes mascotRing{0%{opacity:0.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
  @keyframes mascotPunch{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(0.96)}100%{transform:scale(1)}}
  .spin{animation:spin 1.2s linear infinite}
  .slide-in{animation:slideIn .25s cubic-bezier(.2,.7,.2,1) both}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:-0.01em}
  input,textarea{font-family:inherit;color:inherit;letter-spacing:-0.01em}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="omnisysx-data.jsx"></script>
<script type="text/babel" src="omnisysx-atoms.jsx"></script>
<script type="text/babel" src="omnisysx-bg.jsx"></script>
<script type="text/babel" src="omnisysx-header-hero.jsx"></script>
<script type="text/babel" src="omnisysx-portfolio.jsx"></script>
<script type="text/babel" src="omnisysx-wallets.jsx"></script>
<script type="text/babel" src="omnisysx-pipeline.jsx"></script>
<script type="text/babel" src="omnisysx-ops.jsx"></script>
<script type="text/babel" src="omnisysx-app.jsx"></script>
</body>
</html>
