<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OmnisysX — Documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --surface:#0b0d10;
    --raised:#14171c;
    --raised-2:#191d23;
    --line:rgba(255,255,255,0.07);
    --line-strong:rgba(255,255,255,0.12);
    --text:#f4f5f7;
    --muted:#8a8f99;
    --muted-2:#5b626d;
    --blue:#2962ef;
    --blue-2:#5b9eff;
    --green:#10b981;
    --amber:#f59e0b;
    --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
  html{background:var(--bg)}
  body{overflow-x:hidden}
  ::selection{background:rgba(41,98,239,0.4)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:-0.01em}
  input,textarea{font-family:inherit;color:inherit;letter-spacing:-0.01em}
  a{color:inherit;text-decoration:none}

  /* Doc-prose */
  .doc-prose h1{
    font-size:clamp(36px,4.5vw,52px);
    font-weight:600;
    letter-spacing:-0.03em;
    line-height:1.05;
    margin:0 0 24px;
    color:#fff;
  }
  .doc-prose h2{
    font-size:28px;
    font-weight:600;
    margin:56px 0 20px;
    scroll-margin-top:90px;
    color:#fff;
    letter-spacing:-0.02em;
  }
  .doc-prose h3{
    font-size:20px;
    font-weight:600;
    margin:36px 0 14px;
    scroll-margin-top:90px;
    color:#fff;
    letter-spacing:-0.01em;
  }
  .doc-prose p{
    font-size:15.5px;
    line-height:1.75;
    color:var(--muted);
    margin:0 0 18px;
  }
  .doc-prose p strong{color:#fff;font-weight:600}
  .doc-prose ul,.doc-prose ol{
    font-size:15.5px;
    line-height:1.85;
    color:var(--muted);
    padding-left:24px;
    margin:0 0 18px;
  }
  .doc-prose li{margin:6px 0}
  .doc-prose li strong{color:#fff;font-weight:600}
  .doc-prose code{
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:0.88em;
    background:rgba(41,98,239,0.12);
    padding:2px 7px;
    border-radius:5px;
    color:#8ab4ff;
    border:1px solid rgba(41,98,239,0.2);
  }
  .doc-prose pre{
    line-height:1.65;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 22px;
    position:relative;
    overflow-x:auto;
    margin:0 0 24px;
  }
  .doc-prose pre code{
    border:none;
    padding:0;
    background:transparent;
    color:var(--text);
    font-size:13.5px;
    border-radius:0;
  }
  .doc-prose blockquote{
    border-left:3px solid var(--blue);
    background:rgba(41,98,239,0.06);
    padding:14px 20px;
    border-radius:0 12px 12px 0;
    font-size:15px;
    color:var(--muted);
    margin:0 0 24px;
  }
  .doc-prose blockquote strong{color:#fff}
  .doc-prose a{
    color:var(--blue-2);
    border-bottom:1px solid rgba(91,158,255,0.3);
    transition:border-color 150ms;
  }
  .doc-prose a:hover{border-bottom-color:var(--blue-2)}
  .doc-prose hr{
    border:none;
    border-top:1px solid var(--line);
    margin:48px 0;
  }
  .doc-prose table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    margin:0 0 24px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .doc-prose th{
    text-align:left;
    padding:12px 18px;
    font-weight:500;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    border-bottom:1px solid var(--line);
    background:var(--raised);
    font-size:12px;
  }
  .doc-prose td{
    padding:12px 18px;
    color:var(--muted);
    border-bottom:1px solid rgba(255,255,255,0.04);
    vertical-align:top;
  }
  .doc-prose tr:last-child td{border-bottom:none}
  .doc-prose td strong{color:#fff}
  .copy-btn{
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:11px;
    padding:5px 10px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Inter',system-ui,sans-serif;
    transition:all 150ms;
  }
  .copy-btn:hover{
    background:rgba(255,255,255,0.1);
    color:#fff;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="omnisysx-atoms.jsx"></script>
<script type="text/babel" src="omnisysx-bg.jsx"></script>
<script type="text/babel" src="docs-content.jsx"></script>
<script type="text/babel" src="docs-app.jsx"></script>
</body>
</html>
